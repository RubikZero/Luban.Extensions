name: Release

# Pushing a v<major>.<minor>.<patch> tag is what cuts a release.
#
# The ref filter is deliberately loose ([0-9]* instead of [0-9]+) so that the
# job always starts and the exact format can then be enforced in a step where a
# readable error message is possible. The whole ref must match, so a tag such as
# v1.2.3.4 never triggers the workflow at all.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  # The Luban release the extensions are built and verified against. Keep it in
  # step with the Luban installation the extensions are deployed into: the
  # reference assemblies decide which Luban API the extensions compile against.
  LUBAN_VERSION: '4.5.0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    name: Build and release
    runs-on: windows-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          # Full history: the tag is checked against master below.
          fetch-depth: 0

      - name: Validate the tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME

          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag '$tag' is not v<major>.<minor>.<patch> with a lowercase v and digits only. Nothing was released."
          }

          git fetch --no-tags origin master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Tag '$tag' points at $env:GITHUB_SHA, which is not on master. Nothing was released."
          }

          $version = $tag.Substring(1)
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tag '$tag' is well formed and on master; releasing version $version."

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and verify against the pinned Luban
        uses: ./.github/actions/build-against-luban
        with:
          luban-version: ${{ env.LUBAN_VERSION }}
          assembly-version: ${{ env.RELEASE_VERSION }}

      - name: Package the extension DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $staging = Join-Path $env:RUNNER_TEMP 'package'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          Copy-Item 'MultiRootPathValidator\bin\Release\net8.0\Luban.MultiRootPathValidator.dll' $staging
          Copy-Item 'Luban.ScriptValidator\bin\Release\net8.0\Luban.ScriptValidator.dll' $staging
          Copy-Item 'Luban.ScriptValidator\bin\Release\net8.0\MoonSharp.Interpreter.dll' $staging

          $install = @(
            "Luban.Extensions $env:VERSION",
            "Built and verified against Luban $env:LUBAN_VERSION.",
            "",
            "Contents",
            "  Luban.MultiRootPathValidator.dll",
            "  Luban.ScriptValidator.dll",
            "  MoonSharp.Interpreter.dll   managed dependency of Luban.ScriptValidator",
            "",
            "Install",
            "  1. Copy these files into the directory that contains Luban.dll.",
            "  2. Register every assembly in that directory's Luban.deps.json, under",
            "     both targets.<runtimeTarget> and libraries, or Luban will not load",
            "     them even though they sit next to it.",
            "",
            "  Building this repository with -p:DeployLubanExtensions=true does both",
            "  steps for you through tools/Luban.Extension.Deployer. See the",
            "  repository readme for the command."
          ) -join "`r`n"
          Set-Content -Path (Join-Path $staging 'INSTALL.txt') -Value $install -Encoding utf8

          $zip = "Luban.Extensions-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Get-ChildItem $staging | Format-Table Name, Length
          Write-Host "Packaged $zip"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Re-running the job for the same tag replaces the asset instead of failing.
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:GITHUB_REF_NAME already exists; replacing the asset."
            gh release upload $env:GITHUB_REF_NAME $env:ZIP --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME $env:ZIP `
              --title "Luban.Extensions $env:GITHUB_REF_NAME" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }
          Write-Host "Released $env:GITHUB_REF_NAME with $env:ZIP"
