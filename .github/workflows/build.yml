name: Build

# Every push to master and every pull request builds and verifies the extensions
# against each supported Luban release, so an API change on Luban's side shows up
# here rather than in a release. The release workflow runs the same composite
# action, so a green matrix and a published release mean the same thing.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Luban ${{ matrix.luban }}

    runs-on: windows-latest

    strategy:
      # One failing version must not hide the result of the others.
      fail-fast: false
      matrix:
        # One release per API era in the supported range (4.1.0 and later):
        #
        #   4.1.0   the floor, and the first release with the current DMap API
        #   4.7.0   Scriban jumped 5.12.0 -> 7.1.0
        #   4.12.0  last 4.x, still before PipelineScope
        #   5.0.0   PipelineScope replaced the launcher singleton
        #   5.1.0   current
        #
        # Nothing between these boundaries changes anything the extensions touch,
        # so the sample is what the readme's supported range rests on. See "Luban
        # version support" for the tag-by-tag check and for why 4.1.0 is the floor.
        luban:
          - '4.1.0'
          - '4.7.0'
          - '4.12.0'
          - '5.0.0'
          - '5.1.0'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and verify against Luban ${{ matrix.luban }}
        uses: ./.github/actions/build-against-luban
        with:
          luban-version: ${{ matrix.luban }}
